# Dew's JAX CUDA plugin wheels for one machine, built on GitHub's hosted runner of that machine (dew/build_plugin.sh)
# and attached to the release `release`: an aarch64 build on the free arm64 runner, where no Dew node is one. Bazel
# reads and writes Dew's remote cache (DEW_BAZEL_TOKEN), so a build cut off at the job's limit leaves what it built
# there, and the next run of the same inputs carries on from it.
name: build plugin

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "the fork's commit or branch to build, e.g. release/0.12.0.1.post42"
        required: true
      version:
        description: "every wheel's version, e.g. 0.12.0.1.post42"
        required: true
      release:
        description: "the release the wheels are attached to, e.g. plugin-0.12.0.1.post42"
        required: true
      runner:
        description: "the hosted runner, whose machine the wheels are for"
        required: true
        default: ubuntu-24.04-arm
      pythons:
        required: true
        default: "3.12 3.13 3.14"
      cudas:
        required: true
        default: "12 13"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dew
          sparse-checkout: dew
      - name: Build
        env:
          DEW_BAZEL_TOKEN: ${{ secrets.DEW_BAZEL_TOKEN }}
        run: |
          printf '%s' "$DEW_BAZEL_TOKEN" > "$RUNNER_TEMP/bazel.token"
          DEW_BAZEL_TOKEN_FILE="$RUNNER_TEMP/bazel.token" bash dew/build_plugin.sh "${{ inputs.ref }}" \
            "${{ inputs.version }}" "$RUNNER_TEMP/out" "${{ inputs.pythons }}" "${{ inputs.cudas }}"
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/out"
          # One checksum file a machine and set of Pythons: a later build for other Pythons (cp313 after cp312 and
          # cp314) adds its own beside the first's, never over it.
          sums="wheels-$(uname -m)-py$(echo ${{ inputs.pythons }} | tr ' ' '-').sha256"
          cp wheels.sha256 "$sums"
          gh release upload "${{ inputs.release }}" dist/*.whl "$sums" debug-*.tar.gz -R "$GITHUB_REPOSITORY"
