# Dew's JAX CUDA plugin wheels for one machine, built on GitHub's hosted runner of that machine (dew/build_plugin.sh)
# and attached to the release `release`: every release's aarch64 build, on the free arm64 runner, where no Dew node is
# one. With `cache` on, Bazel reads and writes Dew's remote cache (DEW_BAZEL_TOKEN), so a build cut off at the job's
# limit leaves what it built there; off, the default while row 6204 holds that token as leaked, the build is cold.
#
# The build runs the fork's code and Bazel's, so its job holds no write token and keeps no Git credential: what it
# made goes to `attach`, a job that runs nothing built and alone may write the release (Dew ledger 6204). Inputs reach
# a shell as environment variables, each checked against its form, never as shell source.
name: build plugin

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "the fork's release branch to build (release/0.12.0.1.post42), or the commit a release will be composed at (its full sha, release.sh's BUILT_AT)"
        required: true
      version:
        description: "every wheel's version, e.g. 0.12.0.1.post42"
        required: true
      release:
        description: "the release the wheels are attached to, e.g. plugin-0.12.0.1.post42"
        required: true
      runner:
        description: "the hosted runner, whose machine the wheels are for"
        required: true
        default: ubuntu-24.04-arm
      pythons:
        required: true
        default: "3.12 3.13 3.14"
      cudas:
        required: true
        default: "12 13"
      cache:
        description: "on: Bazel reads and writes Dew's remote cache; off, the default while row 6204 holds its token as leaked: the build is cold and reads no result of it"
        required: true
        default: "off"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    permissions:
      contents: read
    env:
      REF: ${{ inputs.ref }}
      VERSION: ${{ inputs.version }}
      PYTHONS: ${{ inputs.pythons }}
      CUDAS: ${{ inputs.cudas }}
      CACHE: ${{ inputs.cache }}
    steps:
      - name: The inputs are of their forms
        run: |
          [[ "$REF" =~ ^release/[0-9]+(\.[0-9]+)+(\.(post|dev)[0-9]+)?$ || "$REF" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::ref: a release branch, or a commit's full sha"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+(\.(post|dev)[0-9]+)?$ ]] || { echo "::error::version"; exit 1; }
          [[ "$PYTHONS" =~ ^(3\.1[0-9])( 3\.1[0-9])*$ ]] || { echo "::error::pythons"; exit 1; }
          [[ "$CUDAS" =~ ^(1[2-9])( 1[2-9])*$ ]] || { echo "::error::cudas"; exit 1; }
          [[ "$CACHE" =~ ^(on|off)$ ]] || { echo "::error::cache: on or off"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: dew
          sparse-checkout: dew
          persist-credentials: false
      - name: Build
        env:
          DEW_BAZEL_TOKEN: ${{ secrets.DEW_BAZEL_TOKEN }}
        run: |
          code=0
          if [ "$CACHE" = on ]; then
            (umask 077 && printf '%s' "$DEW_BAZEL_TOKEN" > "$RUNNER_TEMP/bazel.token")
            unset DEW_BAZEL_TOKEN
            DEW_BAZEL_TOKEN_FILE="$RUNNER_TEMP/bazel.token" bash dew/build_plugin.sh "$REF" "$VERSION" \
              "$RUNNER_TEMP/out" "$PYTHONS" "$CUDAS" || code=$?
            rm -f "$RUNNER_TEMP/bazel.token"
          else
            # Cold: no remote cache read or written, and no token of it in the job at all (row 6204).
            unset DEW_BAZEL_TOKEN
            DEW_BAZEL_CACHE=off bash dew/build_plugin.sh "$REF" "$VERSION" "$RUNNER_TEMP/out" "$PYTHONS" \
              "$CUDAS" || code=$?
          fi
          exit $code
      - name: What it made
        run: |
          cd "$RUNNER_TEMP/out"
          # One checksum file a machine and set of Pythons: a later build for other Pythons (cp313 after cp312 and
          # cp314) adds its own beside the first's, never over it.
          cp wheels.sha256 "wheels-$(uname -m)-py$(echo "$PYTHONS" | tr ' ' '-').sha256"
          mkdir -p "$RUNNER_TEMP/made" && cp dist/*.whl wheels-*.sha256 debug-*.tar.gz "$RUNNER_TEMP/made/"
      - uses: actions/upload-artifact@v4
        with:
          name: made
          path: ${{ runner.temp }}/made/
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE: ${{ inputs.release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The release, made where there is none
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^plugin-[0-9]+(\.[0-9]+)+(\.(post|dev)[0-9]+)?$ ]] || { echo "::error::release"; exit 1; }
          # One that another attach made meanwhile stands: a create refused is read again, not a failure.
          gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$RELEASE" -R "$GITHUB_REPOSITORY" --title "$RELEASE" --notes \
              "Dew's JAX ${RELEASE#plugin-}: its jaxlib, CUDA plugins and PJRT plugins for each machine, and their debug symbols." ||
            gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" > /dev/null
      - uses: actions/download-artifact@v4
        with:
          name: made
          path: made
      - name: Attach
        run: gh release upload "$RELEASE" made/*.whl made/wheels-*.sha256 made/debug-*.tar.gz -R "$GITHUB_REPOSITORY"
