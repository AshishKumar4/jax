# What Dew's main pins of the fork's releases, indexed as it lands: every few minutes, Dew's main's locks
# (`patch_stack.py pinned`) against the index's page of each project they pin (`unindexed`); a pinned release the
# index holds not whole, staged and passed by its pin head's train, is indexed by patch-stack's `index` with those
# pins, once a version, while no patch-stack run is under way. A hand indexing it
# once the site failed to resolve was the step before (2026-11-17: post104 and post106).
name: index what main pins

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: index-pinned
  cancel-in-progress: false

jobs:
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dew
          persist-credentials: false
      - name: Index each release main pins that the index lacks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir locks
          for url in $(gh api "repos/AshishKumar4/dew/contents/locks?ref=main" \
                         --jq '.[] | select(.name | endswith(".txt")) | .download_url'); do
            curl -fsSL "$url" -o "locks/$(basename "$url")"
          done
          python3 dew/dew/patch_stack.py pinned locks/*.txt > pins.json
          mkdir pages
          for project in $(python3 -c 'import json; print(" ".join(sorted({pin.split("==")[0] for pin in json.load(open("pins.json"))})))'); do
            curl -fsS "https://pypi.dewml.dev/simple/$project/" -o "pages/$project.html" || rm -f "pages/$project.html"
          done
          # Every index run dispatched, all of its history read (paginated, filtered here: the API caps a filtered
          # listing at 1,000 runs), so a stop cannot age out.
          dispatched=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/patch-stack.yml/runs?per_page=100" \
                         --jq '.workflow_runs[] | select(.event == "workflow_dispatch")
                               | [.display_title, .status, .conclusion] | @tsv')
          for version in $(python3 dew/dew/patch_stack.py unindexed pins.json pages); do
            if ! gh release view "jax-$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::warning::main pins jax $version, which no release of the fork holds"
              continue
            fi
            # Its own index run under way (titled by its version, `token`), queued or running: asked again, it would
            # index the version twice; no other run of the workflow holds it (2026-11-17: a run of 11-06 GitHub still
            # lists as queued read as under way, and nothing was asked while main pinned post108 unindexed).
            if awk -F'\t' -v title="patch stack index-$version" '$1 == title && $2 != "completed" { found = 1 }
                                                                    END { exit !found }' <<< "$dispatched"; then
              echo "jax $version: its index run is under way"
              continue
            fi
            # One automatic attempt a version: one that failed or was cancelled waits for a hand to repair and run
            # it again (patch-stack's index), never asked every ten minutes (review).
            if awk -F'\t' -v title="patch stack index-$version" '$1 == title && $2 == "completed" && $3 != "success"
                                                                    { found = 1 } END { exit !found }' <<< "$dispatched"; then
              echo "::warning::jax $version's automatic index did not succeed: index it by hand once repaired"
              continue
            fi
            gh workflow run patch-stack.yml --repo "$GITHUB_REPOSITORY" --ref dew \
              -f index="$version" -f pins="$(cat pins.json)" -f token="index-$version"
            echo "jax $version: indexed as main pins it; any other is asked at a later poll"
            exit 0
          done
