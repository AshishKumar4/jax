# The fixes Dew carries on JAX (dew/patch_stack.py), moved onto each new JAX release and published to
# Dew's package index, https://pypi.dewml.dev/simple. Every six hours it looks for a release upstream has
# tagged that this fork carries no stack for; it rebases the newest stack onto it, dropping the fixes the
# release already has, runs the stack's tests and pushes the result as a candidate (candidate/vNEW), opening
# an issue that asks for its whole-stack review (bible §2): it never moves the stack branch nor publishes. A
# conflict, a red test or a release that holds every fix says so in that issue. Run by hand with `publish`
# once a stack is reviewed, it publishes its release's one approved artifact set: the jax wheel, tested
# installed and out of its source tree, and, where the stack carries native patches, the CUDA and PJRT
# plugins of every supported Python and machine its plugin release (plugin-VERSION) holds, all or none (a
# file the index lists already is kept as it is). With `test`, it tests a candidate's ref; with `yank`, it
# marks wheels the index lists yanked (PEP 592), so an installer resolving a range passes them over.
#
# Code it fetched or built (the stack, its tests, their dependencies, jax's build backend) runs only in jobs that hold
# no write token, no storage key and no Git credential (`test`, `carry`, `assemble`); what they made reaches the jobs
# that write (`candidate` pushes a Git bundle, `issue` opens an issue naming the run, `index` publishes files) as
# artifacts, and those jobs run nothing of it (Dew ledger 6204). Inputs reach a shell as environment variables, each
# checked against its form.
name: patch stack

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "publish this reviewed stack's artifact set, e.g. 0.12.0.1 (its stack branch's release), instead of looking for a new release"
        required: false
      rehearse:
        description: "rebase and test onto a release without pushing or publishing, e.g. \"0.11.2 0.12.0\""
        required: false
      test:
        description: "a candidate stack's ref to test, its release's stock jaxlib beside it, e.g. release/0.12.0.1.post44-candidate (no push, no publish)"
        required: false
      yank:
        description: "mark these wheels yanked, instead of looking for a new release, e.g. \"jax-0.12.0.post7-py3-none-any.whl\""
        required: false
      reason:
        description: "why the wheels in `yank` are yanked, shown by installers"
        required: false
      token:
        description: "a token the run's name carries, by which a dispatcher (dew/release.sh) finds its own run"
        required: false
      machines:
        description: "with `publish`, the machines whose native wheels it ships (default: every one, \"x86_64 aarch64\"); a machine left out keeps its earlier plugins, which a later publish of the same release adds beside"
        required: false

run-name: ${{ inputs.token && format('patch stack {0}', inputs.token) || 'patch stack' }}

permissions:
  contents: read

concurrency: patch-stack

env:
  # The stack's tests: the API its fixes change, and each test file the stack adds or changes over its release,
  # its fixes' own regressions (`patch_stack.py tests`). A stack is pushed, and its wheel published, only where
  # they pass. JAX's test cases set their checks for each test whatever JAX_ENABLE_CHECKS says (on, or off as
  # TransferGuardTest sets them), so they run once.
  TESTS: tests/api_test.py
  # protobuf as Dew installs it beside every wheel of the stack: the stack's HLO reader (jax.extend.xla) reads
  # an HLO module's instructions through it (0.12.0.1.post74's publish: its tests could not import it).
  # grpcio-tools, whose protoc describes the .proto a shipped schema is held to (tests/mosaic_gpu_records_test.py,
  # 0.12.0.1.post77's publish).
  TEST_DEPENDENCIES: absl-py cloudpickle hypothesis portpicker pytest pytest-xdist mpmath pillow scipy protobuf
    grpcio-tools

defaults:
  run:
    # bash -eo pipefail: a step fails where any command of a pipeline does.
    shell: bash

jobs:
  test:
    if: inputs.test != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: dew
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Test the candidate
        env:
          CANDIDATE: ${{ inputs.test }}
        run: |
          [[ "$CANDIDATE" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::test: a ref"; exit 1; }
          git clone -q --filter=blob:none "https://github.com/$GITHUB_REPOSITORY.git" jax
          cd jax
          git checkout -q "$CANDIDATE"
          # Its release: the jaxlib its version.py's _version names, which it installs beside.
          release=$(sed -n 's/^_version = "\(.*\)"$/\1/p' jax/version.py)
          git fetch -q --no-tags https://github.com/jax-ml/jax.git "refs/tags/jax-v$release:refs/tags/jax-v$release"
          uv venv -q --python 3.12 ../venv
          uv pip install -q --python ../venv/bin/python "jaxlib==$release" . $TEST_DEPENDENCIES
          tests="$TESTS $(python3 ../dew/dew/patch_stack.py tests "$release")"
          echo "tests: $tests"
          ../venv/bin/python -m pytest -q -n auto -p no:cacheprovider $tests

  carry:
    if: inputs.test == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ inputs.publish }}
      pair: ${{ steps.next.outputs.pair }}
      old: ${{ steps.rebase.outputs.old }}
      new: ${{ steps.rebase.outputs.new }}
      result: ${{ steps.rebase.outputs.result }}
      tested: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: dew
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: The release to carry
        id: next
        if: inputs.publish == '' && inputs.yank == ''
        env:
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          if [ -n "$REHEARSE" ]; then pair=$REHEARSE; else pair=$(python3 dew/dew/patch_stack.py next); fi
          [[ -z "$pair" || "$pair" =~ ^[0-9]+(\.[0-9]+)+\ [0-9]+(\.[0-9]+)+$ ]] || { echo "::error::a pair of releases"; exit 1; }
          echo "pair=$pair" >> "$GITHUB_OUTPUT"
      - name: Rebase the stack onto it
        id: rebase
        if: steps.next.outputs.pair != ''
        env:
          PAIR: ${{ steps.next.outputs.pair }}
        run: |
          read -r old new <<< "$PAIR"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          git clone -q --filter=blob:none --no-checkout "https://github.com/$GITHUB_REPOSITORY.git" jax
          cd jax
          git remote add upstream https://github.com/jax-ml/jax.git
          git fetch -q origin "v$old-cache-key-pool-fingerprints:v$old-cache-key-pool-fingerprints"
          git fetch -q --no-tags upstream "refs/tags/jax-v$old:refs/tags/jax-v$old" "refs/tags/jax-v$new:refs/tags/jax-v$new"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          code=0
          python3 ../dew/dew/patch_stack.py rebase "$old" "$new" || code=$?
          # Words, not numbers: an expression compares an empty output with "0" as equal.
          case $code in 0) result=rebased ;; 2) result=conflict ;; 3) result=upstreamed ;; *) result=failed ;; esac
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Test it
        id: tests
        if: steps.rebase.outputs.result == 'rebased'
        env:
          NEW: ${{ steps.rebase.outputs.new }}
        run: |
          cd jax
          uv venv -q --python 3.12 ../venv
          uv pip install -q --python ../venv/bin/python "jaxlib==$NEW" . $TEST_DEPENDENCIES
          tests="$TESTS $(python3 ../dew/dew/patch_stack.py tests "$NEW")"
          ../venv/bin/python -m pytest -q -n auto -p no:cacheprovider $tests
      - name: Bundle the candidate
        if: always() && steps.rebase.outputs.result == 'rebased' && inputs.rehearse == ''
        env:
          NEW: ${{ steps.rebase.outputs.new }}
        run: git -C jax bundle create "$RUNNER_TEMP/candidate.bundle" "v$NEW-cache-key-pool-fingerprints"
      - uses: actions/upload-artifact@v4
        if: always() && steps.rebase.outputs.result == 'rebased' && inputs.rehearse == ''
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate.bundle

  candidate:
    needs: carry
    if: always() && needs.carry.outputs.result == 'rebased' && inputs.rehearse == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NEW: ${{ needs.carry.outputs.new }}
    steps:
      # A candidate for review, never the stack branch: the stack moves, and its artifacts are published, only once
      # its whole stack is reviewed (bible §2; `publish`). Git alone runs here, on the bundle `carry` made.
      - uses: actions/checkout@v4
        with:
          path: fork
          sparse-checkout: dew
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: bundle
      - name: Push it as a candidate
        run: |
          [[ "$NEW" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::a release"; exit 1; }
          git -C fork fetch -q "$GITHUB_WORKSPACE/bundle/candidate.bundle" "v$NEW-cache-key-pool-fingerprints:refs/candidate"
          git -C fork push -q origin "refs/candidate:refs/heads/candidate/v$NEW"

  issue:
    needs: [carry, candidate]
    if: always() && inputs.rehearse == '' && needs.carry.outputs.pair != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      NEW: ${{ needs.carry.outputs.new }}
      RESULT: ${{ needs.carry.outputs.result }}
      TESTED: ${{ needs.carry.outputs.tested }}
      PUSHED: ${{ needs.candidate.result }}
    steps:
      - name: Open an issue
        run: |
          case "$RESULT" in
            conflict) why="a fix does not apply" ;;
            upstreamed) why="the release holds every fix: Dew can return to it" ;;
            rebased)
              if [ "$PUSHED" != success ]; then
                why="the stack rebased, but candidate/v$NEW was not pushed ($PUSHED)"
              elif [ "$TESTED" = success ]; then
                why="candidate/v$NEW is rebased and green, for its whole-stack review before publish"
              else
                why="candidate/v$NEW is rebased, its tests red"
              fi ;;
            *) why="the rebase failed" ;;
          esac
          # The run, linked: its logs say what the rebase and the tests said; no output of theirs is copied here.
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf 'Carrying the patch stack onto jax %s: %s.\n\nRun: %s\n' "${NEW:-?}" "$why" "$run" > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Patch stack onto jax ${NEW:-?}: $why" --body-file issue.md

  assemble:
    needs: carry
    if: needs.carry.outputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE: ${{ needs.carry.outputs.release }}
      # The native projects a stack with native patches ships beside jax, each built for every supported Python
      # (the plugins; the PJRT plugins name none) on each machine (dew/build_plugin.sh).
      PYTHONS: "cp312 cp313 cp314"
      # Every machine's, unless `machines` names those built so far (Main, 2026-11-08: post67's x86_64 set staged ahead
      # of its aarch64 one, which Lambda had no GH200 to build); the index keeps what it lists, so publishing the
      # same release again with every machine adds the rest.
      MACHINES: ${{ inputs.machines || 'x86_64 aarch64' }}
      CUDAS: "12 13"
    steps:
      - name: The inputs are of their forms
        run: |
          [[ "$RELEASE" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::publish: a release"; exit 1; }
          [[ "$MACHINES" =~ ^(x86_64|aarch64)( (x86_64|aarch64))*$ ]] || { echo "::error::machines"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: dew
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Build the stack's wheel, and fetch the release's own
        run: |
          git clone -q --filter=blob:none --branch "v$RELEASE-cache-key-pool-fingerprints" \
            "https://github.com/$GITHUB_REPOSITORY.git" jax
          git -C jax fetch -q --no-tags https://github.com/jax-ml/jax.git "refs/tags/jax-v$RELEASE:refs/tags/jax-v$RELEASE"
          uv build -q --wheel --out-dir dist jax
          uv venv -q venv
          uv pip install -q --python venv/bin/python pip
          venv/bin/python -m pip download -q --no-deps --only-binary :all: --dest dist "jax==$RELEASE"
          ls dist
      - name: Its native artifacts, all of them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A stack that patches native code (jaxlib/, jax_plugins/) reaches a kernel only through its own CUDA and
          # PJRT plugins (post42 shipped the plugin's patch alone, and kernels compiled through stock PJRT): the
          # set publishes whole or not at all, from the plugin release whose native code the stack holds
          # (`patch_stack.py plugins`): the stack's own version's, or, for a post release of Python fixes alone,
          # the earlier one's, whose files the index lists already are kept as they are, so a machine an earlier
          # publish left out (`machines`) is added by the next (2026-11-08: post67's aarch64 plugins, built after
          # its x86_64 publish, reached the index with post68's).
          mkdir -p native
          if git -C jax diff --quiet "jax-v$RELEASE" HEAD -- jaxlib jax_plugins; then
            echo "no native patch: jax alone"
            exit 0
          fi
          version=$(ls dist/jax-"$RELEASE".post*-py3-none-any.whl | sed -n 's|^dist/jax-\(.*\)-py3-none-any.whl$|\1|p')
          plugins=$(cd jax && python3 ../dew/dew/patch_stack.py plugins "$version")
          if [ -z "$plugins" ]; then
            echo "::error::no plugin release holds $version's native code: build plugin-$version (dew/build_plugin.sh)"
            exit 1
          fi
          echo "$version's native code is $plugins's"
          version=${plugins#plugin-}
          gh release download "$plugins" --repo "$GITHUB_REPOSITORY" --dir native --pattern "*.whl"
          missing=()
          for cuda in $CUDAS; do
            for machine in $MACHINES; do
              ls native/jax_cuda"$cuda"_pjrt-"$version"-py3-none-manylinux_*_"$machine".whl > /dev/null 2>&1 \
                || missing+=("jax-cuda$cuda-pjrt $machine")
              for python in $PYTHONS; do
                ls native/jax_cuda"$cuda"_plugin-"$version"-"$python"-"$python"-manylinux_*_"$machine".whl \
                  > /dev/null 2>&1 || missing+=("jax-cuda$cuda-plugin $python $machine")
              done
            done
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::plugin-%s lacks %s\n' "$version" "${missing[@]}"
            exit 1
          fi
          ls native
      - name: Test the stack's wheel
        run: |
          # The stack's tests against the wheel installed beside its release's jaxlib, out of the tree it was
          # built from (dew/test_wheel.sh), which a source-tree run imports first.
          uv venv -q --python 3.12 tested
          wheel=$(ls dist/jax-"$RELEASE".post*-py3-none-any.whl)
          uv pip install -q --python tested/bin/python "$wheel" "jaxlib==$RELEASE" $TEST_DEPENDENCIES
          tests="$TESTS $(cd jax && python3 ../dew/dew/patch_stack.py tests "$RELEASE")"
          PYTEST_ARGS="-n auto" bash dew/dew/test_wheel.sh tested/bin/python "$wheel" jax $tests
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            dist/*.whl
            native/
          if-no-files-found: error

  index:
    needs: [carry, assemble]
    if: always() && (needs.assemble.result == 'success' || (inputs.yank != '' && needs.carry.result == 'success' && needs.carry.outputs.release == ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      YANK: ${{ inputs.yank }}
      REASON: ${{ inputs.reason }}
      BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      CUDAS: "12 13"
    steps:
      - uses: actions/checkout@v4
        with:
          path: dew
          persist-credentials: false
      - name: The index's storage is configured
        run: |
          for name in BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || { echo "::error::the R2 secrets (R2_BUCKET, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) are not set"; exit 1; }
          done
      # What assemble made, into a directory of its own: no file of it lands on this job's own scripts.
      - uses: actions/download-artifact@v4
        if: needs.assemble.result == 'success'
        with:
          name: artifacts
          path: incoming
      - name: Index them
        run: |
          # jax (its wheels, or only the files `yank` names), then each native project, every one through
          # dew/index.sh, which reads each wheel's name and metadata and runs nothing of it.
          shopt -s nullglob
          PACKAGE=jax bash dew/dew/index.sh site incoming/dist/*.whl
          export YANK=
          for cuda in $CUDAS; do
            for project in pjrt plugin; do
              wheels=(incoming/native/jax_cuda"$cuda"_"$project"-*.whl)
              [ ${#wheels[@]} -eq 0 ] || bash dew/dew/index.sh site "${wheels[@]}"
            done
          done
