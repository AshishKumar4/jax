# A build node's plugin wheels attached to plugin-VERSION from where the node left them, the GPU outputs bucket, each
# by a presigned URL, so no byte of them passes through the machine that asks (dew-ops' dewops.node.attach): the
# release made where there is none, then each file fetched, checked against its sha256, attached without replacing
# an asset of other bytes and read back anonymously, by the one attach Dew's fixture store runs too
# (AshishKumar4/dew-fixtures' .github/actions/attach, pinned by its commit). A machine's wheels a GitHub runner
# builds attach through build-plugin.yml's own job.
name: attach plugin
run-name: attach plugin ${{ inputs.version }} ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "the wheels' version, e.g. 0.12.0.1.post111; the release is plugin-VERSION"
        required: true
      assets:
        description: 'a JSON list of {"url": presigned URL, "sha256": its SHA-256, "asset": the asset name}'
        required: true
      request:
        description: "the asker's own name for this run, which its run name carries so the asker finds it"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: The release, made where there is none
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+(\.(post|dev)[0-9]+)?$ ]] || { echo "::error::version"; exit 1; }
          release="plugin-$VERSION"
          # One that another attach made meanwhile stands: a create refused is read again, not a failure.
          gh release view "$release" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$release" -R "$GITHUB_REPOSITORY" --title "$release" --notes \
              "Dew's JAX $VERSION: its jaxlib, CUDA plugins and PJRT plugins for each machine, and their debug symbols." ||
            gh release view "$release" -R "$GITHUB_REPOSITORY" > /dev/null

  attach:
    needs: release
    name: attach ${{ matrix.asset }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(inputs.assets) }}
    steps:
      # Every URL masked before any step names one: a composite action's inputs are printed before its own steps
      # run, its own mask among them. Read from the event's own file, never interpolated into this step.
      - name: Mask the staged URLs
        run: jq -r '.inputs.assets | fromjson | .[].url' "$GITHUB_EVENT_PATH" | while read -r url; do echo "::add-mask::$url"; done
      - uses: AshishKumar4/dew-fixtures/.github/actions/attach@8e865e552d82dbf06fdad3d5d54f362b6fed3f62
        with:
          url: ${{ matrix.url }}
          sha256: ${{ matrix.sha256 }}
          asset: ${{ matrix.asset }}
          release: plugin-${{ inputs.version }}
          repository: ${{ github.repository }}
          token: ${{ github.token }}

  # Each wheel's core metadata (PEP 658), FILE.metadata beside it on the release, read from the attached wheel
  # itself: a release's staging index (patch_stack.py's `staged`) states it, so a lock resolving from that index
  # reads each wheel's METADATA alone and fetches no wheel (Dew's train 1273: 35 locks at once, each fetching
  # every staged wheel of every machine, were refused by GitHub's releases). One already beside its wheel stands;
  # one another attach of the release writes at once is the same bytes (--clobber). Run whatever the attach's
  # outcome, so an ask of no assets ('[]') writes a release's missing metadata alone.
  metadata:
    needs: [release, attach]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Each wheel's METADATA attached beside it
        run: |
          set -euo pipefail
          release="plugin-$VERSION"
          names=$(gh release view "$release" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for wheel in $(grep '\.whl$' <<< "$names"); do
            grep -qxF "$wheel.metadata" <<< "$names" && continue
            gh release download "$release" -R "$GITHUB_REPOSITORY" --pattern "$wheel" --dir wheels --clobber
            metadata=$(unzip -Z1 "wheels/$wheel" | grep -E '^[^/]+\.dist-info/METADATA$')
            unzip -p "wheels/$wheel" "$metadata" > "$wheel.metadata"
            gh release upload "$release" -R "$GITHUB_REPOSITORY" "$wheel.metadata" --clobber
            rm -f "wheels/$wheel" "$wheel.metadata"
          done
