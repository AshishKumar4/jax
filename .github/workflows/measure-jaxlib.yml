# How long the fork's jaxlib takes to build on one of GitHub's hosted runners, by jax's own CI configuration of that
# machine (.bazelrc ci_darwin_arm64 without its push to Google's cache; ci_windows_amd64), measured and published
# nowhere: one Python's build cold (as Dew's remote cache stands), then again from a fresh output base (what that cache
# then serves). Each build's seconds and exit in the run's summary and its builds.tsv artifact (Main, 2026-11-14:
# whether macOS arm64 and Windows jaxlib builds are cheap enough to keep those platforms).
#
# The cache's token reaches Bazel only through a credential helper reading a file (dew/bazel_credentials.py), on no
# option or line Bazel can echo, and no raw log leaves the runner (Dew ledger 6204: an option once printed it). Inputs
# reach a shell as environment variables, each checked against its form.
name: measure jaxlib

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "the fork's release branch to build, e.g. release/0.12.0.1.post91"
        required: true
      runner:
        description: "the hosted runner: macos-15 or windows-latest"
        required: true
      python:
        required: true
        default: "3.12"
      cache:
        description: "dew: Dew's Bazel cache, the log kept on the runner; none: no cache and no token in the process, the log uploaded"
        required: true
        default: "dew"

permissions:
  contents: read

jobs:
  build:
    strategy:
      max-parallel: 1
      matrix:
        attempt: [cold, cached]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ inputs.ref }}
      RUNNER: ${{ inputs.runner }}
      PYTHON: ${{ inputs.python }}
      ATTEMPT: ${{ matrix.attempt }}
      CACHE: ${{ inputs.cache }}
    steps:
      - name: The inputs are of their forms
        run: |
          [[ "$REF" =~ ^release/[0-9]+(\.[0-9]+)+(\.(post|dev)[0-9]+)?$ ]] || { echo "::error::ref: a release branch"; exit 1; }
          [[ "$RUNNER" =~ ^(macos-1[4-9]|windows-latest|windows-202[2-9])$ ]] || { echo "::error::runner"; exit 1; }
          [[ "$PYTHON" =~ ^3\.1[0-9]$ ]] || { echo "::error::python"; exit 1; }
          [[ "$CACHE" =~ ^(dew|none)$ ]] || { echo "::error::cache: dew or none"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: dew
          path: dew-tools
          sparse-checkout: dew
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}
      - name: Build
        id: build
        env:
          # No token reaches a run of no cache, whose log leaves the runner.
          DEW_BAZEL_TOKEN: ${{ inputs.cache == 'dew' && secrets.DEW_BAZEL_TOKEN || '' }}
        run: |
          case "$RUNNER_OS" in
            macOS) config=(--bazel_options=--config=clang_local --bazel_options=--macos_minimum_os=11.0)
                   base="$RUNNER_TEMP/base" ;;
            Windows) config=(--bazel_options=--config=ci_windows_amd64
                             "--bazel_startup_options=--host_jvm_args=-Djava.security.properties=file:///$(cygpath -m "$PWD")/ci/bazel_dns_windows.security")
                     base="C:/b" ;;
            *) echo "a runner of macOS or Windows" >&2; exit 2 ;;
          esac
          token="$RUNNER_TEMP/bazel.token"
          if [[ "$CACHE" == dew ]]; then
            # The token in a file of the runner's own, out of the build's sources; the variable gone before Bazel runs.
            (umask 077 && printf '%s' "$DEW_BAZEL_TOKEN" > "$token")
            unset DEW_BAZEL_TOKEN
            helper="$GITHUB_WORKSPACE/dew-tools/dew/bazel_credentials.py"
            case "$RUNNER_OS" in
              Windows) launcher="$RUNNER_TEMP/credentials.bat"
                       printf '@"%s" "%s" "%s" %%*\r\n' "$(cygpath -w "$(command -v python)")" "$(cygpath -w "$helper")" \
                         "$(cygpath -w "$token")" > "$launcher"
                       launcher=$(cygpath -m "$launcher") ;;
              *) launcher="$RUNNER_TEMP/credentials"
                 printf '#!/bin/sh\nexec %q %q %q "$@"\n' "$(command -v python)" "$helper" "$token" > "$launcher"
                 chmod 700 "$launcher" ;;
            esac
            printf 'common --remote_cache=https://dew-bazel.ashishkmr472.workers.dev/bazel\ncommon --credential_helper=dew-bazel.ashishkmr472.workers.dev=%s\ncommon --remote_upload_local_results=true\n' \
              "$launcher" > .bazelrc.user
          else
            # No cache: nothing secret in the process, so its log may leave the runner.
            [[ -z "$DEW_BAZEL_TOKEN" && ! -e .bazelrc.user && ! -e "$token" ]] || {
              echo "::error::a run of no cache holds a token or a .bazelrc.user"; exit 1; }
            config+=(--bazel_options=--config=public_cache)
          fi
          # The wheel's version the ref's, as a release names it (dew/build_plugin.sh): its suffix past jax's
          # _version given to Bazel and the wheel builder alike, the tree's _release_version unset, where Bazel
          # declared the bare version and the builder wrote the release's (macos-15, 43860907164).
          suffix=$(python - "${REF#release/}" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path("jax/version.py")
          text = path.read_text()
          base = re.search(r'^_version = "(.*)"$', text, re.M).group(1)
          version = sys.argv[1]
          assert version.startswith(base) and version != base, f"{version} is not {base} with a suffix"
          text, count = re.subn(r"^_release_version: str \| None = .*$", "_release_version: str | None = None",
                                text, count=1, flags=re.M)
          assert count == 1, "jax/version.py states no _release_version"
          path.write_text(text)
          print(version[len(base):])
          PY
          )
          started=$(date +%s) code=0
          python build/build.py build --wheels=jaxlib --python_version="$PYTHON" "${config[@]}" \
            --bazel_options=--repo_env=ML_WHEEL_TYPE=release --bazel_options=--repo_env=ML_WHEEL_VERSION_SUFFIX="$suffix" \
            --bazel_startup_options=--output_base="$base" \
            --output_path="$RUNNER_TEMP/dist" > "$RUNNER_TEMP/build.log" 2>&1 || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          seconds=$(( $(date +%s) - started ))
          rm -f .bazelrc.user "$token"
          printf '%s\t%s\t%s\t%s\t%s\n' "$RUNNER" "$PYTHON" "$ATTEMPT" "$seconds" "$code" | tee "$RUNNER_TEMP/builds.tsv"
          echo "| $RUNNER | cp$PYTHON | $ATTEMPT | ${seconds} s | exit ${code} |" >> "$GITHUB_STEP_SUMMARY"
          # Bazel's last summary lines alone, never its option or target echoes.
          grep -E '^(INFO: (Elapsed|Build completed|[0-9]+ processes)|ERROR: Build did NOT)' "$RUNNER_TEMP/build.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-${{ inputs.runner }}-${{ matrix.attempt }}
          # Its seconds and exit alone: no raw build log leaves the runner.
          path: ${{ runner.temp }}/builds.tsv
      - name: A failed Windows action's command, run again in its execroot
        # A run of no cache (no secret in the process) whose Windows build failed: its first failed cmd.exe
        # action (a genrule's command, a copy's batch file), each bazel-out or external path it names with
        # its length and whether it and its directory exist, and its command run again for what cmd prints.
        if: always() && inputs.cache == 'none' && runner.os == 'Windows' && steps.build.outputs.code != '0'
        run: |
          [[ -f "$RUNNER_TEMP/build.log" && -d C:/b/execroot/_main ]] || { echo "no build ran"; exit 0; }
          python - "$RUNNER_TEMP/build.log" <<'PY'
          import os, re, subprocess, sys
          # Bazel colours its ERROR lines: their codes stripped.
          log = re.sub(r"\x1b\[[0-9;]*m", "", open(sys.argv[1], encoding="utf-8", errors="replace").read())
          found = re.search(r"^ERROR: [^\n]*failed: \(Exit \d+\): cmd\.exe failed:[^\n]*\n(.*?)\n# Configuration", log,
                            re.M | re.S)
          if found is None:
              sys.exit(print("no failed cmd.exe action"))
          command = next((line.strip() for line in found.group(1).splitlines()
                          if line.strip().startswith("cmd.exe")), None)
          if command is None:
              sys.exit(print("no command line"))
          print("COMMAND", command)
          os.chdir("C:/b/execroot/_main")
          batch = re.fullmatch(r"cmd\.exe /C (\S+\.bat)", command)
          text = open(batch.group(1), errors="replace").read() if batch else command
          if batch:
              print("BATCH\n" + text)
          for path in sorted(set(re.findall(r"(?:bazel-out|external)[\\/][^\s\"'&>|]+", text))):
              absolute = os.path.abspath(path)
              print("PATH", path, len(absolute), "exists" if os.path.exists(path) else "MISSING",
                    "| directory", "exists" if os.path.isdir(os.path.dirname(path)) else "MISSING")
              # A missing path's components from the execroot: each one's kind (a link's target read) up to
              # the first that is not there.
              walked = ""
              for part in re.split(r"[\\/]", path):
                  walked = os.path.join(walked, part) if walked else part
                  if not os.path.lexists(walked):
                      print("   first missing", walked, "| its directory holds",
                            sorted(os.listdir(os.path.dirname(walked)))[:12] if os.path.isdir(os.path.dirname(walked))
                            else "(no directory)")
                      break
                  if os.path.islink(walked) or os.path.isjunction(walked):
                      try:
                          target = os.readlink(walked)
                      except OSError as error:
                          target = f"unreadable: {error}"
                      print("   link", walked, "->", target, "| resolves", os.path.exists(walked))
          try:
              done = subprocess.run(command, shell=True, capture_output=True, text=True, timeout=900,
                                    stdin=subprocess.DEVNULL)
          except subprocess.TimeoutExpired:
              sys.exit(print("RERUN TimeoutExpired after 900 s"))
          print("RERUN exit", done.returncode)
          print("STDOUT", done.stdout[-3000:])
          print("STDERR", done.stderr[-3000:])
          PY
      - name: The log of a run of no cache holds no token
        id: clean
        if: always() && inputs.cache == 'none'
        env:
          # As the build step was given it: empty in a run of no cache.
          DEW_BAZEL_TOKEN: ${{ inputs.cache == 'dew' && secrets.DEW_BAZEL_TOKEN || '' }}
        run: |
          [[ ! -e .bazelrc.user && ! -e "$RUNNER_TEMP/bazel.token" && -z "$DEW_BAZEL_TOKEN" ]] || {
            echo "::error::a token or .bazelrc.user exists: the log stays on the runner"; exit 1; }
          [[ -f "$RUNNER_TEMP/build.log" ]] || { echo "::error::no build log"; exit 1; }
          # grep's 1 alone (no line names Dew's cache) passes; a match or an error keeps the log.
          code=0; grep -q "dew-bazel" "$RUNNER_TEMP/build.log" || code=$?
          [[ $code -eq 1 ]] || { echo "::error::the log names Dew's cache, or grep failed ($code)"; exit 1; }
      - uses: actions/upload-artifact@v4
        # Only past the check above: a log it found a token's trace in stays on the runner.
        if: always() && inputs.cache == 'none' && steps.clean.outcome == 'success'
        with:
          name: measure-${{ inputs.runner }}-${{ matrix.attempt }}-log
          path: ${{ runner.temp }}/build.log
