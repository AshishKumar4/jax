# A package Dew carries a build of beside JAX's (Qwix's), published to Dew's package index,
# https://pypi.dewml.dev/simple: the wheel of a fork's release commit, whose own version names it
# (0.1.8.post1), built from `repository` at `ref`, its `tests` run on it, then indexed beside the packages the
# index holds already; and `upstream`, PyPI's own wheels of the package's releases, which the index serves
# too, as an installer that finds a package on this index looks for its every version here (uv's first-index
# rule). A file the index lists already is kept as it is. `release` indexes instead the wheels attached to a
# GitHub release, the artifact that release's own CI built and tested (Dew's python-publish.yml attaches its
# sdist and wheel), so nothing is rebuilt between a test and the index; `package` picks one project of a release
# whose wheels are several projects' (a fork's jax and its CUDA plugins), one publish a project. A project new to
# the index is indexed only where `new_project` names it: once here, an installer that lists this index first
# resolves it from here alone, so Dew's lock, which resolves it from PyPI until a pin head maps it here
# explicitly, would find only what this index holds (ledger 3116: the CUDA plugins' first publish broke every
# lane's lock gate).
#
# The package's build backend, its tests and their dependencies run in `assemble`, a job that holds no storage key and
# no write token and keeps no Git credential; `index` runs nothing it fetched, holds the index's keys, and takes what
# `assemble` made as files (Dew ledger 6204: built code never shares a job with publishing credentials).
name: publish package

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "the fork to build, e.g. AshishKumar4/qwix, or the repository of `release`"
        required: true
      release:
        description: "a release's tag whose attached wheels are indexed as they are, e.g. v0.2.0 (no build, no tests)"
        required: false
      ref:
        description: "its release commit or branch, e.g. dew/0.1.8.post1; none indexes `upstream` alone"
        required: false
      tests:
        description: "pytest's arguments, run in the clone against the built wheel"
        required: false
      dependencies:
        description: "what the tests install beside the wheel, e.g. \"jax flax pytest absl-py\""
        required: false
      upstream:
        description: "PyPI releases whose own wheels the index serves too, every Python's and platform's, e.g. \"qwix==0.1.8\""
        required: false
      package:
        description: "the project of `release`'s wheels to index, e.g. jax-cuda12-plugin; none: its wheels are one project's"
        required: false
      new_project:
        description: "the project this publish adds to the index, where it holds none of it yet, e.g. jax-cuda12-plugin: named only once Dew's pyproject maps it to this index explicitly"
        required: false

permissions:
  contents: read

concurrency: patch-stack

defaults:
  run:
    shell: bash

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REPOSITORY: ${{ inputs.repository }}
      REF: ${{ inputs.ref }}
      TESTS: ${{ inputs.tests }}
      DEPENDENCIES: ${{ inputs.dependencies }}
      UPSTREAM: ${{ inputs.upstream }}
      RELEASE: ${{ inputs.release }}
      PACKAGE_WANTED: ${{ inputs.package }}
    steps:
      - name: The inputs are of their forms
        run: |
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::repository"; exit 1; }
          [[ -z "$PACKAGE_WANTED" || "$PACKAGE_WANTED" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::package"; exit 1; }
          [ -z "$RELEASE" ] || [ -z "$REF" ] || { echo "::error::release and ref name two artifacts: give one"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: dew
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Fetch PyPI's own wheels
        if: inputs.upstream != ''
        # Every wheel of each release, whatever its Python or platform, checked against PyPI's digest: an installer
        # that finds the package here looks for each of its versions here alone (uv's first-index rule).
        run: |
          mkdir -p dist
          read -ra releases <<< "$UPSTREAM"
          for release in "${releases[@]}"; do
            [[ "$release" =~ ^[A-Za-z0-9._-]+==[A-Za-z0-9.+_-]+$ ]] || { echo "::error::upstream: $release"; exit 1; }
            curl -fsS "https://pypi.org/pypi/${release%%==*}/${release##*==}/json" > release.json
            python3 - <<'EOF'
          import hashlib, json, urllib.request
          from pathlib import Path
          for file in json.load(open("release.json"))["urls"]:
              if file["packagetype"] == "bdist_wheel":
                  data = urllib.request.urlopen(file["url"]).read()
                  if hashlib.sha256(data).hexdigest() != file["digests"]["sha256"]:
                      raise SystemExit(f"{file['filename']}: its download differs from PyPI's digest")
                  Path("dist", file["filename"]).write_bytes(data)
          EOF
          done
          ls dist
      - name: Fetch the release's wheels
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A wheel's file name holds its project's name with - as _ (PEP 427).
          gh release download "$RELEASE" --repo "$REPOSITORY" --dir dist \
            --pattern "${PACKAGE_WANTED:+${PACKAGE_WANTED//-/_}-}*.whl"
          ls dist
      - name: Build the wheel
        if: inputs.ref != ''
        run: |
          git clone -q "https://github.com/$REPOSITORY.git" source
          git -C source checkout -q "$REF"
          uv build -q --wheel --out-dir source-dist source
          mkdir -p dist && cp source-dist/*.whl dist/
          ls dist
      - name: Test the wheel
        if: inputs.ref != ''
        run: |
          uv venv -q --python 3.12 tested
          read -ra dependencies <<< "$DEPENDENCIES"
          uv pip install -q --python tested/bin/python source-dist/*.whl "${dependencies[@]}"
          read -ra tests <<< "$TESTS"
          # Against the installed wheel, out of the source tree (dew/test_wheel.sh).
          bash dew/dew/test_wheel.sh tested/bin/python source-dist/*.whl source "${tests[@]}"
      - name: What it made
        run: mkdir -p dist && ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/
          if-no-files-found: error

  index:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      NEW_PROJECT: ${{ inputs.new_project }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: dew
          persist-credentials: false
      - name: The index's storage is configured
        run: |
          for name in BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || { echo "::error::the R2 secrets (R2_BUCKET, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) are not set"; exit 1; }
          done
          [[ -z "$NEW_PROJECT" || "$NEW_PROJECT" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::new_project"; exit 1; }
      # What assemble made, into a directory of its own: no file of it lands on this job's own scripts.
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: incoming
      - name: Index it
        run: |
          # Files alone: nothing assemble made is run here; dew/index.sh reads each wheel's name and metadata.
          shopt -s nullglob
          wheels=(incoming/*.whl)
          bash dew/dew/index.sh site "${wheels[@]}"
