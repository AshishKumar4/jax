syntax = "proto3";

package mosaic.gpu;

option java_outer_classname = "MosaicGpuProto";
option java_multiple_files = true;

message MosaicGpuKernelProto {
  int32 version = 1;
  bytes object_file = 2;
  bool is_nvshmem_used = 3;
  bytes kernel_hash = 4;
  string host_func_name = 5;
  bool is_multimem_used = 7;
  bytes gpu_binary = 8;
  string kernel_name = 9;
  int32 smem_bytes = 10;
  int32 cluster_size = 11;
  repeated int64 xla_replica_ids = 12;
  repeated bool symmetric_memory_parameters = 13;
  bool uses_xla_collective_metadata = 14;
  bool skip_device_barrier = 15;
  optional int64 collective_id = 16;
  // What the kernel's caller stated of its launch (an identity, a resource
  // decision), opaque to Mosaic: the custom call's `metadata` attribute, kept
  // with the compiled call so a reader of a serialized executable finds it.
  bytes caller_metadata = 17;
  // What ptxas noted of a loss of performance in the kernel's assembly, in its
  // order: a warpgroup MMA serialized (C7510 to C7515), a register move it
  // ignores (C7507). Read once from ptxas's report as it assembled the kernel,
  // so a reader of a compiled call finds them as data.
  repeated AssemblerNote assembler_notes = 18;

  reserved 6;
  reserved "init_func_name";
}

// A note ptxas made of a loss of performance in a kernel's assembly.
message AssemblerNote {
  // Its code, as ptxas states it: `C7515`.
  string code = 1;
  // Its message, as ptxas states it after the code.
  string message = 2;
}
