syntax = "proto3";

package mosaic.gpu;

option java_outer_classname = "MosaicGpuProto";
option java_multiple_files = true;

message MosaicGpuKernelProto {
  int32 version = 1;
  bytes object_file = 2;
  bool is_nvshmem_used = 3;
  bytes kernel_hash = 4;
  string host_func_name = 5;
  bool is_multimem_used = 7;
  bytes gpu_binary = 8;
  string kernel_name = 9;
  int32 smem_bytes = 10;
  int32 cluster_size = 11;
  // Since version 5: what decided the compile (kernel_store.h's
  // CompileIdentity), which keys the kernel in a process.
  string identity = 12;
  // Since version 5: the PTX assembled and the PTX compiler's log, kept with
  // the kernel whatever the dumps asked, and the basename its dumps take.
  bytes ptx = 13;
  string compilation_log = 14;
  string dump_basename = 15;

  reserved 6;
  reserved "init_func_name";
}
